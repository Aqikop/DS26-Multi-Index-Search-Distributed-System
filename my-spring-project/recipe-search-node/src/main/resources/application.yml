server:
  port: 8100

recipe-search:
  candidate-limit: 100
  top-k: 10
  query-timeout-seconds: 180
  qdrant:
    host: ${QDRANT_HOST:}
    port: ${QDRANT_GRPC_PORT:}
    tls: ${QDRANT_TLS:}
    api-key: ${QDRANT_API_KEY:}
    collection: recipes_nutrition
    vector-name: ${QDRANT_RECIPE_VECTOR_NAME:}
    inference-model: ${QDRANT_INFERENCE_MODEL:}
